    <style>
        body {

            background-color: #0a0a0a;
            color: #ffffff;
            
            /* SECURITY: Mencegah user memblok/menyeleksi teks */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* SECURITY: Mencegah gambar di-drag and drop ke desktop */

            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            pointer-events: none; /* Opsional: membuat interaksi klik tembus ke div parent */

        .section-transition {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>

    </main>

    <script>
        let currentSectionId = 'personal';
        let isAnimating = false;

        function navigate(targetId) {
            if (isAnimating || currentSectionId === targetId) return;
            isAnimating = true;

            const currentSection = document.getElementById('section-' + currentSectionId);
            const targetSection = document.getElementById('section-' + targetId);

            // Styling Navbar
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-white');
                btn.classList.add('text-gray-500');
                const underline = btn.querySelector('.nav-underline');
                underline.classList.remove('scale-x-100');
                underline.classList.add('scale-x-0');
            });

            const activeNav = document.getElementById('nav-' + targetId);
            activeNav.classList.remove('text-gray-500');
            activeNav.classList.add('text-white');
            const activeUnderline = activeNav.querySelector('.nav-underline');
            activeUnderline.classList.remove('scale-x-0');
            activeUnderline.classList.add('scale-x-100');

            // Animasi Keluar
            currentSection.classList.remove('opacity-100', 'translate-y-0', 'z-10');
            currentSection.classList.add('opacity-0', 'translate-y-8', 'z-0');

            setTimeout(() => {
                currentSection.classList.add('hidden');
                targetSection.classList.remove('hidden');
                
                void targetSection.offsetWidth;

                // Animasi Masuk
                targetSection.classList.remove('opacity-0', 'translate-y-8', 'z-0');
                targetSection.classList.add('opacity-100', 'translate-y-0', 'z-10');

                targetSection.scrollTop = 0;
                currentSectionId = targetId;
                
                setTimeout(() => {
                    isAnimating = false;
                }, 500); 
            }, 500); 
        }

        // ==========================================
        // SCRIPT KEAMANAN (ANTI-COPAS / INSPECT)
        // ==========================================
        
        // 1. Mematikan tombol shortcut keyboard berbahaya (Inspect Element, Save, View Source)
        document.onkeydown = function(e) {
            // F12
            if(event.keyCode == 123) {
                return false;
            }
            // Ctrl+Shift+I (Inspect)
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) {
                return false;
            }
            // Ctrl+Shift+J (Console)
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) {
                return false;
            }
            // Ctrl+Shift+C (Inspect/Select)
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) {
                return false;
            }
            // Ctrl+U (View Source)
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) {
                return false;
            }
            // Ctrl+S (Save Page)
            if(e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) {
                return false;
            }
        }
    </script>
